name: baltcicl

services:
  baltcircle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the host env at build time (set by the deploy workflow from
        # the GitHub Actions secret). Empty -> app falls back to the demo map.
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    container_name: baltcircle-mvp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Managed PostgreSQL connection string (Yandex Cloud). SECRET — read from
      # the host env (set by the deploy workflow from the GitHub `DATABASE_URL`
      # secret). Required: the app fails fast if the pool cannot connect. Format:
      # postgresql://user:password@host:6432/dbname?sslmode=verify-full
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # SMS OTP — backend-only runtime config (not inlined into the client
      # bundle). Read from the host env (set by the deploy workflow from GitHub
      # secrets). If SMS_PROVIDER is empty the app uses a dev fallback that logs
      # codes instead of sending SMS, so production must set SMS_PROVIDER=smsru.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      # SigmaSMS provider config (used when SMS_PROVIDER=sigmasms). The static
      # account token is SECRET and read from the host env (set by the deploy
      # workflow from the GitHub `SIGMASMS` secret). SIGMASMS_TOKEN is an alias
      # honoured first if present. Sender + API base are optional and default to
      # "TakeRide" / the production host inside the app when empty.
      SIGMASMS_TOKEN: ${SIGMASMS_TOKEN:-}
      SIGMASMS_SENDER: ${SIGMASMS_SENDER:-}
      SIGMASMS_API_BASE: ${SIGMASMS_API_BASE:-}
      # Optional dedicated secret for hashing OTP codes; falls back to
      # SESSION_SECRET when unset.
      OTP_SECRET: ${OTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Comma-separated list of phone numbers granted the admin role. Temporary
      # bootstrap until a role-admin UI exists. Read from the host env (set by
      # the deploy workflow from a GitHub secret). Empty -> no auto-admins.
      ADMIN_PHONE_NUMBERS: ${ADMIN_PHONE_NUMBERS:-}
      # T-Bank / T-Kassa acquiring — backend-only runtime config (never inlined
      # into the client bundle). Terminal key + password are SECRET and read from
      # the host env (set by the deploy workflow from GitHub secrets). When the
      # key/password are empty the payment endpoints return 503 and the UI shows
      # "Платежи настраиваются" — the app keeps running.
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      # IMPORTANT — preserving a `$` in the password. The `${TBANK_PASSWORD:-}`
      # form below reads the value from the HOST process environment and passes
      # it through verbatim (Compose does not re-interpolate the substituted
      # value), so a password like `$ecret` survives intact when exported in the
      # shell that runs `docker compose`. The danger is a Compose `.env` file:
      # Compose DOES interpolate `.env`, so a literal `$` there must be written
      # as `$$` (e.g. TBANK_PASSWORD=$$ecret) or it will be mangled/truncated.
      # Prefer host env (the deploy workflow injects GitHub secrets that way).
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      # API base defaults to the production acquiring host inside the app when empty.
      TBANK_API_BASE: ${TBANK_API_BASE:-}
      # Public origin used to build Success/Fail/Notification URLs; defaults to
      # https://takeride.ru inside the app when empty.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # RuSender (transactional email for OTP verification). Without both
      # API key and key ID the server falls back to logging the code.
      RUSENDER_API_KEY: ${RUSENDER_API_KEY:-}
      RUSENDER_KEY_ID: ${RUSENDER_KEY_ID:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      # OAuth (Yandex ID / VK ID). Endpoints return 503 when unset.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_APP_ID: ${VK_APP_ID:-}
      VK_SECURE_KEY: ${VK_SECURE_KEY:-}
      # Web Push VAPID keys. Пустые — push выключен (endpoints отвечают 503).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:no-reply@takeride.ru}
    ports:
      # Bind only to loopback so the app is reachable through nginx on the same
      # host, not exposed on all interfaces to the outside world (audit L8).
      - "127.0.0.1:5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # App data now lives in managed PostgreSQL (DATABASE_URL); no local DB
      # volume needed. OSM tiles are served from a read-only host bind mount.
      - /home/yc-user/osm:/app/osm:ro
      # Вложения чата поддержки (фото от клиентов). MVP: локальный
      # bind mount — при рестарте контейнера файлы сохраняются.
      # Позже будет заменено на Yandex Object Storage.
      - /home/yc-user/uploads:/app/uploads

  # OMNI smart-lock TCP ingest. Same image, different entry point
  # (dist/omni.cjs, built alongside dist/index.cjs by script/build.ts) and its
  # own container, because the locks hold persistent TCP sockets: redeploying the
  # web app must not disconnect the fleet, and a lock firmware problem must not
  # take the website down. Both processes share the managed database and its
  # idempotent schema bootstrap.
  baltcircle-omni:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baltcircle-omni
    restart: unless-stopped
    command: ["node", "dist/omni.cjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Listen port for lock connections. This is OUR listen socket, not device
      # config: the IP/port/APN each lock dials is flashed on the lock itself
      # (over BLE on the sample units, at the factory for a bulk order), so no
      # device endpoint is configured here. Change this only in lockstep with
      # what the locks are flashed to dial.
      OMNI_TCP_PORT: ${OMNI_TCP_PORT:-5100}
      OMNI_MAX_CONNECTIONS: ${OMNI_MAX_CONNECTIONS:-500}
      OMNI_IDLE_TIMEOUT_MS: ${OMNI_IDLE_TIMEOUT_MS:-900000}
      OMNI_STATUS_MIN_INTERVAL_MS: ${OMNI_STATUS_MIN_INTERVAL_MS:-60000}
      OMNI_FLUSH_INTERVAL_MS: ${OMNI_FLUSH_INTERVAL_MS:-2000}
      OMNI_MAX_BATCH_ROWS: ${OMNI_MAX_BATCH_ROWS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Unlike the web app (loopback-only behind nginx), this must be reachable
      # from the mobile networks the locks sit on, so it binds all interfaces.
      # The cloud security group has to allow the port inbound as well.
      - "${OMNI_TCP_PORT:-5100}:${OMNI_TCP_PORT:-5100}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Liveness: the process is healthy when it is accepting TCP connections.
    # There is no HTTP surface to probe, so this opens a socket and hangs up.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(Number(process.env.OMNI_TCP_PORT||5100),'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3