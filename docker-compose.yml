name: baltcicl

services:
  baltcircle:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from the host env at build time (set by the deploy workflow from
        # the GitHub Actions secret). Empty -> app falls back to the demo map.
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    container_name: baltcircle-mvp
    restart: unless-stopped
    # Audit (scalability): json-file driver has no size cap by default, and
    # every request is logged at info level (server/logger.ts) - unbounded
    # growth would eventually fill the single VM's disk as traffic grows.
    # Rotate at 20MB x 5 files (~100MB ceiling) per service.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Audit (scalability): no cap existed, so a leak or a runaway burst (e.g.
    # a lock flood, or a slow client-holding-connections spike) could OOM the
    # whole 4 vCPU / 4GB host — there's nothing else here to fail over to.
    # This is the only container on the VM besides the GitHub Actions runner
    # and nginx (both host-level, not containerized), so cap well under the
    # host total: 3 of 4 vCPU, 3 of 4 GB RAM, leaving headroom for the OS,
    # nginx, the runner's own build steps, and the managed-Postgres client
    # connections' local overhead. Raise only alongside a VM resize.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3072M
    environment:
      NODE_ENV: production
      PORT: 5000
      # V8's default old-space sizing is based on the host's total memory as
      # seen inside the container, not the cgroup limit above — without this,
      # the heap can grow past the 3072M container cap and get OOM-killed by
      # the kernel instead of Node handling memory pressure gracefully.
      # 2048MB leaves ~1GB of the cap for non-heap usage (buffers, native
      # modules, thread stacks, the OMNI TCP gateway's socket registry).
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
      # Managed PostgreSQL connection string (Yandex Cloud). SECRET — read from
      # the host env (set by the deploy workflow from the GitHub `DATABASE_URL`
      # secret). Required: the app fails fast if the pool cannot connect. Format:
      # postgresql://user:password@host:6432/dbname?sslmode=verify-full
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Postgres pool size + log verbosity — tunable without a code change
      # (audit M1: previously hardcoded to the in-code defaults with no way
      # to override them in production short of editing this file).
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # SMS OTP — backend-only runtime config (not inlined into the client
      # bundle). Read from the host env (set by the deploy workflow from GitHub
      # secrets). If SMS_PROVIDER is empty the app uses a dev fallback that logs
      # codes instead of sending SMS, so production must set SMS_PROVIDER=smsru.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      # SigmaSMS provider config (used when SMS_PROVIDER=sigmasms). The static
      # account token is SECRET and read from the host env (set by the deploy
      # workflow from the GitHub `SIGMASMS` secret). SIGMASMS_TOKEN is an alias
      # honoured first if present. Sender + API base are optional and default to
      # "TakeRide" / the production host inside the app when empty.
      SIGMASMS_TOKEN: ${SIGMASMS_TOKEN:-}
      # Alias accepted by server/sms.ts (GitHub secret name is `SIGMASMS`);
      # SIGMASMS_TOKEN above takes precedence when both are set (audit M1).
      SIGMASMS: ${SIGMASMS:-}
      SIGMASMS_SENDER: ${SIGMASMS_SENDER:-}
      SIGMASMS_API_BASE: ${SIGMASMS_API_BASE:-}
      # TEMPORARY moderation-test override — see .env.example. Empty = normal
      # OTP text.
      SIGMASMS_MESSAGE_TEMPLATE: ${SIGMASMS_MESSAGE_TEMPLATE:-}
      # Optional dedicated secret for hashing OTP codes; falls back to
      # SESSION_SECRET when unset.
      OTP_SECRET: ${OTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # AES-256-GCM master key for encrypting T-Bank RebillId/AccountToken at
      # rest (payment_methods table). REQUIRED in production — the app throws
      # on first payment-method write if unset. Read from the host env (set by
      # the deploy workflow from the GitHub `PAYMENT_TOKEN_KEY` secret).
      PAYMENT_TOKEN_KEY: ${PAYMENT_TOKEN_KEY:-}
      # Comma-separated list of phone numbers granted the admin role. Temporary
      # bootstrap until a role-admin UI exists. Read from the host env (set by
      # the deploy workflow from a GitHub secret). Empty -> no auto-admins.
      ADMIN_PHONE_NUMBERS: ${ADMIN_PHONE_NUMBERS:-}
      # Shared bearer token for the third-party GPS/IoT HTTP telemetry path
      # (server/http/rides.ts). Empty -> that endpoint returns 503; OMNI TCP
      # locks are unaffected (they don't use this token).
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN:-}
      # Runtime dir for support-chat attachment uploads; defaults to ./uploads
      # inside the container when empty. Kept independent of the bind mount
      # path below so the app-side default and the host path can diverge.
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      # T-Bank / T-Kassa acquiring — backend-only runtime config (never inlined
      # into the client bundle). Terminal key + password are SECRET and read from
      # the host env (set by the deploy workflow from GitHub secrets). When the
      # key/password are empty the payment endpoints return 503 and the UI shows
      # "Платежи настраиваются" — the app keeps running.
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      # IMPORTANT — preserving a `$` in the password. The `${TBANK_PASSWORD:-}`
      # form below reads the value from the HOST process environment and passes
      # it through verbatim (Compose does not re-interpolate the substituted
      # value), so a password like `$ecret` survives intact when exported in the
      # shell that runs `docker compose`. The danger is a Compose `.env` file:
      # Compose DOES interpolate `.env`, so a literal `$` there must be written
      # as `$$` (e.g. TBANK_PASSWORD=$$ecret) or it will be mangled/truncated.
      # Prefer host env (the deploy workflow injects GitHub secrets that way).
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      # API base defaults to the production acquiring host inside the app when empty.
      TBANK_API_BASE: ${TBANK_API_BASE:-}
      # Card-binding tuning (server/tbank.ts) — was previously only
      # overridable by editing code; now a real ops lever for sandbox
      # testing / rollback to AddCard without a redeploy (audit M1).
      TBANK_ADD_CARD_CHECK_TYPE: ${TBANK_ADD_CARD_CHECK_TYPE:-3DS}
      TBANK_CARD_BIND_AMOUNT_KOPEKS: ${TBANK_CARD_BIND_AMOUNT_KOPEKS:-100}
      TBANK_CARD_BIND_METHOD: ${TBANK_CARD_BIND_METHOD:-payment}
      # Public origin used to build Success/Fail/Notification URLs; defaults to
      # https://takeride.ru inside the app when empty.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # RuSender (transactional email for OTP verification). Without both
      # API key and key ID the server falls back to logging the code.
      RUSENDER_API_KEY: ${RUSENDER_API_KEY:-}
      RUSENDER_KEY_ID: ${RUSENDER_KEY_ID:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      # OAuth (Yandex ID / VK ID). Endpoints return 503 when unset.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_APP_ID: ${VK_APP_ID:-}
      VK_SECURE_KEY: ${VK_SECURE_KEY:-}
      # Web Push VAPID keys. Пустые — push выключен (endpoints отвечают 503).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:no-reply@takeride.ru}
      LOCK_GATEWAY_PORT: ${LOCK_GATEWAY_PORT:-5100}
      LOCK_GATEWAY_HOST: ${LOCK_GATEWAY_HOST:-0.0.0.0}
      # OMNI TCP gateway tuning (server/omni/index.ts) — connection/frame-rate
      # limits and write-batching. Defaults match the in-code fallbacks; now
      # overridable in production without touching code (audit M1).
      OMNI_MAX_CONNECTIONS: ${OMNI_MAX_CONNECTIONS:-500}
      OMNI_IDLE_TIMEOUT_MS: ${OMNI_IDLE_TIMEOUT_MS:-900000}
      OMNI_MAX_NEW_CONNECTIONS_PER_IP: ${OMNI_MAX_NEW_CONNECTIONS_PER_IP:-20}
      OMNI_NEW_CONNECTION_WINDOW_MS: ${OMNI_NEW_CONNECTION_WINDOW_MS:-60000}
      OMNI_MAX_FRAMES_PER_SECOND: ${OMNI_MAX_FRAMES_PER_SECOND:-5}
      OMNI_FRAME_BUCKET_CAPACITY: ${OMNI_FRAME_BUCKET_CAPACITY:-20}
      OMNI_STATUS_MIN_INTERVAL_MS: ${OMNI_STATUS_MIN_INTERVAL_MS:-60000}
      OMNI_FLUSH_INTERVAL_MS: ${OMNI_FLUSH_INTERVAL_MS:-2000}
      OMNI_MAX_BATCH_ROWS: ${OMNI_MAX_BATCH_ROWS:-500}
      # TEMPORARY live-lock onboarding diagnostic (server/omni/server.ts
      # logOmniDiag) — unset by default (no-op for the whole fleet). Set to a
      # single IMEI to log every frame from that device at info level before
      # the persistence throttle, to see the device's true reporting cadence
      # while onboarding it. Remove once the QA checkup pipeline is finalised.
      OMNI_DIAG_IMEI: ${OMNI_DIAG_IMEI:-}
      # TEMPORARY (same lifecycle as OMNI_DIAG_IMEI above): unset by default.
      # When both this and OMNI_DIAG_IMEI are set, the server sends ONE
      # experimental D1 tracking-interval command (with this many seconds as
      # the parameter) to that exact lock, once, a few seconds after it
      # connects — to empirically probe firmware-dependent D1 semantics
      # (shared/omni/protocol.ts). Zero effect on the rest of the fleet.
      OMNI_DIAG_SEND_D1_SECONDS: ${OMNI_DIAG_SEND_D1_SECONDS:-}
    ports:
      # Bind only to loopback so the app is reachable through nginx on the same
      # host, not exposed on all interfaces to the outside world (audit L8).
      - "127.0.0.1:5000:5000"
      - "${LOCK_GATEWAY_PORT:-5100}:${LOCK_GATEWAY_PORT:-5100}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # App data now lives in managed PostgreSQL (DATABASE_URL); no local DB
      # volume needed. OSM tiles are served from a read-only host bind mount.
      - /home/yc-user/osm:/app/osm:ro
      # Вложения чата поддержки (фото от клиентов). MVP: локальный
      # bind mount — при рестарте контейнера файлы сохраняются.
      # Позже будет заменено на Yandex Object Storage.
      - /home/yc-user/uploads:/app/uploads
