# BaltCircle edge (nginx) — TLS termination, HTTP→HTTPS redirect and security
# headers in front of the Node app on 127.0.0.1:5000 (audit H4).
#
# This app handles payments and geolocation, so plain HTTP is not acceptable in
# production. Certificate issuance/renewal is automated by
# .github/workflows/configure-takeride-domain.yml (certbot certonly --webroot),
# which writes cert/key to /etc/letsencrypt/live/takeride.ru/ (referenced below).
# This file is the canonical prod config for the takeride.ru domain — applied
# verbatim by that workflow, do not hand-edit it on the server.

# ---------------------------------------------------------------------------
# Edge rate limiting (audit M9).
# ---------------------------------------------------------------------------
# Brute-forcing OTP codes and hammering the payment endpoints are the two abuse
# vectors worth stopping at the edge, before a request ever reaches the Node
# app. Keyed on the client IP; ~10 req/min each, with a small burst so a normal
# user retrying does not get blocked. Over-limit requests are rejected with 429
# (logged in the access log). The app keeps its own per-account OTP lockout —
# this is defence in depth, not a replacement.
limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;
# Separate, more generous zone for read-only pending-binding status polls
# (GET refresh-bind[-sbp], POST .../refresh). The client polls its own
# pending card/SBP binding every 3s while waiting on a 3-D Secure step, which
# is ~20 req/min sustained — well above payment_limit's 10r/m. These GETs
# only read state the caller already owns (no card data, no charge), so they
# are not the abuse vector payment_limit exists to stop; giving them their
# own bucket keeps polling from starving the actual bind-card/bind-sbp POST
# in the same session (previously: 429 on "Привязать карту" after the poll
# had already drained the shared payment_limit bucket).
limit_req_zone $binary_remote_addr zone=payment_poll_limit:10m rate=40r/m;
limit_req_status 429;

# Connection limiting (audit M3) — distinct from limit_req above: this bounds
# how many SIMULTANEOUS connections one IP can hold open (Slowloris-style /
# connection-exhaustion abuse), not request rate. 20 is generous for a normal
# browser (a handful of tabs, each opening a few connections plus the SSE
# active-ride stream) while still capping a single abusive client.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# Port 80: serve the ACME http-01 challenge and redirect everything else to 443.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name takeride.ru www.takeride.ru;

    # Let certbot answer the http-01 challenge over plain HTTP during issuance
    # and renewal. Point --webroot at this directory.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else is redirected to HTTPS (301 permanent).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: TLS termination + reverse proxy to the Node app.
# ---------------------------------------------------------------------------
server {
    # Old-style combined directive (works on nginx >=1.9.5, incl. versions
    # that predate the separate `http2 on;` directive introduced in 1.25.1).
    listen 443 ssl http2;
    server_name takeride.ru www.takeride.ru;

    # --- TLS certificate (Let's Encrypt paths) -------------------------------
    ssl_certificate     /etc/letsencrypt/live/takeride.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/takeride.ru/privkey.pem;

    # Modern, safe defaults. `ssl-dhparams.pem` is generated by certbot; if you
    # do not use certbot, generate one with:
    #   openssl dhparam -out /etc/nginx/ssl-dhparams.pem 2048
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_dhparam /etc/nginx/ssl-dhparams.pem;   # uncomment once generated

    # Explicit cipher pin (audit M3) — Mozilla "Intermediate" list. TLS 1.3
    # negotiates its own fixed suite regardless of this directive (nginx
    # ignores ssl_ciphers for 1.3), so this only constrains the TLS 1.2
    # fallback — still worth pinning explicitly rather than trusting whatever
    # the OS OpenSSL build defaults to.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # OCSP stapling (audit M3) — the server fetches the CA's revocation
    # status once and staples it to the handshake, instead of every visiting
    # browser querying the CA's OCSP responder itself (faster handshake,
    # works even if the client can't reach the CA). chain.pem (intermediate
    # only, no leaf) is what ssl_trusted_certificate needs for the stapling
    # verification request — certbot writes it alongside fullchain.pem.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/takeride.ru/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Security headers ---------------------------------------------------
    # HSTS: force HTTPS for two years incl. subdomains. Only sent over HTTPS.
    # Remove `preload` (and submit the domain) only if you understand the
    # implications; keep it out until you are certain HTTPS is permanent.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Locks down powerful browser APIs the app never uses (audit M3). geolocation
    # is deliberately left out of this deny-list — the app's own ride-tracking
    # UI genuinely needs it via the browser's Geolocation API.
    add_header Permissions-Policy "camera=(), microphone=(), usb=(), payment=(), magnetometer=(), gyroscope=()" always;

    # Content-Security-Policy — a baseline tuned NOT to break current features:
    #   * MapLibre GL loads its worker from a blob: URL and fetches vector/raster
    #     tiles + glyphs over https (self-hosted tile endpoints and, in dev,
    #     public demo tiles) — allow blob: worker and https/data img/connect.
    #   * T-Bank / T-Kassa payment flow REDIRECTS to securepay.tinkoff.ru (it is
    #     not embedded), but frame-src is allowed for it defensively in case a
    #     3DS step-up is framed.
    #   * 'unsafe-inline'/'unsafe-eval' are permitted for scripts/styles because
    #     the current Vite build and MapLibre rely on them; tighten to nonces
    #     later if the bundle allows.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https://securepay.tinkoff.ru https://*.tinkoff.ru; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://securepay.tinkoff.ru; object-src 'none'" always;

    # --- Reverse proxy to the Node app -------------------------------------
    # Common proxy settings are set at server scope so every location below
    # inherits them; each location only adds its own proxy_pass (+ rate limit).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (active-ride stream) and WebSocket upgrades must pass through.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;

    # Body-size / timeout / connection-count policy (audit M3). 15m gives
    # headroom above the app's own express.json limit of 12mb (support-chat
    # attachments are sent as base64 JSON, ~8MB file + encoding overhead) —
    # nginx must accept at least as much as the app does, or legitimate
    # uploads get a 413 here before ever reaching the app's own validation.
    client_max_body_size 15m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    # limit_conn is set per-location (not here) so the T-Bank webhook location
    # below — the one exempt from limit_req — can stay exempt too: nginx only
    # inherits limit_conn from the server level when a location has no
    # limit_conn of its own, and there's no "limit_conn off" directive to
    # override that inheritance explicitly, so exemption has to mean "never
    # set it there" rather than "turn it off there".

    # T-Bank payment webhook is a server-to-server callback — it must NOT be
    # rate limited or a burst of legitimate notifications would be dropped.
    # Declared before the /api/payments/ prefix so it wins the match.
    location = /api/payments/tbank/notification {
        proxy_pass http://127.0.0.1:5000;
    }

    # OTP start/verify — the OTP brute-force / SMS-flood surface.
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }

    # Pending-binding status polls (audit fix: was sharing payment_limit with
    # bind-card/bind-sbp below, so the client's 3s poll loop drained the
    # bucket and the real bind attempt got 429'd). Longer/more specific
    # prefixes than /api/payments/ below, so nginx's longest-prefix-match
    # picks these over it regardless of declaration order; the regex location
    # for the .../refresh POST similarly overrides the /api/payment-methods
    # prefix match per nginx's "regex wins over non-^~ prefix" rule.
    location /api/payments/tbank/refresh-bind-sbp/ {
        limit_req zone=payment_poll_limit burst=20 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }
    location /api/payments/tbank/refresh-bind/ {
        limit_req zone=payment_poll_limit burst=20 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }
    location ~ ^/api/payment-methods/\d+/refresh$ {
        limit_req zone=payment_poll_limit burst=20 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }

    # Payment initiation, card binding, wallet top-up / tariff purchase.
    location /api/payments/ {
        limit_req zone=payment_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }
    location /api/payment-methods {
        limit_req zone=payment_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }
    location /api/wallet/ {
        limit_req zone=payment_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        limit_conn conn_limit 20;
        proxy_pass http://127.0.0.1:5000;
    }
}
