name: Uptime Monitor

# Audit HIGH #23 (zero-budget variant) — keep the health check external.
# GitHub-hosted schedule is best-effort, not a five-minute SLA: actual runs
# have occurred hours apart. An independent provider is needed for reliable
# cadence. Do not move this onto the production VM to make a failed check green.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  # A diagnostic branch must not block the main monitoring queue.
  group: uptime-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check production health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout probe
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe takeride.ru
        id: probe
        run: python3 scripts/probe_production_health.py

      # Dispatching this existing workflow on a diagnostic branch is read-only:
      # no production issue is opened, commented on or closed from that branch.
      - name: Find existing incident issue
        id: find
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          num=$(gh issue list --repo "${{ github.repository }}" \
            --label incident --state open --search "in:title \"Prod incident\"" \
            --json number --jq '.[0].number // ""')
          echo "issue_number=$num" >> "$GITHUB_OUTPUT"

      - name: Ensure incident label exists
        if: github.ref == 'refs/heads/main' && steps.probe.outputs.healthy == '0' && steps.find.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create incident --repo "${{ github.repository }}" \
            --color B60205 --description "Production availability incident" --force

      - name: Open incident issue
        if: github.ref == 'refs/heads/main' && steps.probe.outputs.healthy == '0' && steps.find.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PROBLEM: ${{ steps.probe.outputs.network_problem }}
          PROBE_PROBLEM: ${{ steps.probe.outputs.probe_problem }}
          API_HEALTHY: ${{ steps.probe.outputs.api_healthy }}
          PMTILES_RESPONSE_PROBLEM: ${{ steps.probe.outputs.pmtiles_response_problem }}
          PROBE_SUMMARY: ${{ steps.probe.outputs.failure_summary }}
        run: |
          detail="Автоматический мониторинг (uptime-monitor.yml) обнаружил проблему."
          if [ "$NETWORK_PROBLEM" = "1" ]; then
            detail="$detail\n\n**Сеть:** внешний runner не получил HTTP-ответ. Это не подтверждает повреждение файлов карты; код выхода curl, ошибка, DNS, IP и тайминги записаны в Probe."
          fi
          if [ "$PROBE_PROBLEM" = "1" ]; then
            detail="$detail\n\n**Проверка:** сбой инструмента мониторинга; доступность сайта не определена. См. Probe."
          fi
          if [ "$API_HEALTHY" = "0" ]; then
            detail="$detail\n\n**API:** один или оба домена не прошли проверку HTTP 200; см. классификацию в Probe."
          fi
          if [ "$PMTILES_RESPONSE_PROBLEM" = "1" ]; then
            detail="$detail\n\n**Карта:** получен неверный или неполный ответ на Range для kaliningrad.pmtiles, addresses.pmtiles или addresses-v2.pmtiles. Требуются HTTP 206, точный диапазон 0-6 и семь байт PMTiles."
          fi
          detail="$detail\n\n**Неудачные проверки:** $PROBE_SUMMARY"
          gh issue create --repo "${{ github.repository }}" \
            --title "🔴 Prod incident: takeride.ru" \
            --label incident \
            --body "$(printf '%b' "$detail")

          **Обнаружено:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Прогон:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Единая точка отказа — одна production VM без failover. Порядок диагностики: docs/runbook-incident-response.md.

          Issue закроется автоматически только после успешной проверки обоих API и всех трёх архивов с внешнего runner."

      # Keep one incident open; do not comment or email on every failed poll.
      - name: Close incident issue on recovery
        if: github.ref == 'refs/heads/main' && steps.probe.outputs.healthy == '1' && steps.find.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ steps.find.outputs.issue_number }}" --repo "${{ github.repository }}" \
            --body "Восстановлено: $(date -u '+%Y-%m-%d %H:%M:%S UTC'). Внешний мониторинг успешно проверил оба API и kaliningrad.pmtiles, addresses.pmtiles, addresses-v2.pmtiles."
          gh issue close "${{ steps.find.outputs.issue_number }}" --repo "${{ github.repository }}"

      - name: Fail the run if unhealthy
        if: always() && steps.probe.outputs.healthy == '0'
        run: exit 1
