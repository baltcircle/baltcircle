name: One-off data fix — remove dot separator from SBP labels (manual)

# Narrowly-scoped, single-use data correction. Code fix (main@2471679)
# changed the label format for NEW SBP bindings from "СБП · <Банк>" to
# "СБП <Банк>" (single space, no middle-dot), but rows bound before that
# commit still have the old "·" separator baked into their stored label.
# This updates already-active/pending sbp rows in place so the UI shows
# the new format without waiting for a rebind. Never auto-runs —
# workflow_dispatch only, requires typing an exact confirmation phrase,
# gated behind the same "production" environment manual-approval used by
# deploy.yml since it writes to the production database. Intended to be
# deleted (or left inert) once used — this is a one-off runbook step, not
# a recurring admin tool.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: FIX-SBP-LABEL-SEPARATOR'
        required: true

permissions: {}

jobs:
  fix-labels:
    name: Replace " · " with " " in sbp payment_methods labels
    runs-on:
      - self-hosted
      - baltcircle-prod
    environment: production
    steps:
      - name: Validate confirmation phrase
        run: |
          set -e
          if [ "${{ github.event.inputs.confirm }}" != "FIX-SBP-LABEL-SEPARATOR" ]; then
            echo "❌ Confirmation phrase did not match — refusing to touch production data."
            exit 1
          fi

      - name: Write correction SQL
        run: |
          cat > "${{ github.workspace }}/fix-sbp-labels.sql" <<'SQL'
          BEGIN;

          SELECT 'BEFORE' AS phase, id, user_id, label FROM payment_methods
           WHERE type = 'sbp' AND label LIKE '%· %';

          UPDATE payment_methods
             SET label = replace(label, ' · ', ' ')
           WHERE type = 'sbp' AND label LIKE '%· %';

          SELECT 'AFTER' AS phase, id, user_id, label FROM payment_methods
           WHERE type = 'sbp';

          COMMIT;
          SQL

      - name: Fetch Yandex Cloud CA cert
        run: curl -fsSL -o "${{ github.workspace }}/yc-root.crt" https://storage.yandexcloud.net/cloud-certs/CA.pem

      - name: Apply correction
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Secret DATABASE_URL is not set."
            exit 1
          fi
          # sslmode=verify-full (enforced by the app itself) needs the Yandex
          # Cloud managed-Postgres CA to verify the server cert; libpq looks
          # for it at ~/.postgresql/root.crt by default when sslrootcert isn't
          # given in the URL, so point PGSSLROOTCERT at the file we mount in.
          docker run --rm \
            -e DATABASE_URL \
            -e PGSSLROOTCERT=/certs/root.crt \
            -v "${{ github.workspace }}/fix-sbp-labels.sql:/fix.sql:ro" \
            -v "${{ github.workspace }}/yc-root.crt:/certs/root.crt:ro" \
            postgres:16-alpine \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /fix.sql
