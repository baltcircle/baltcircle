name: Diagnose omni container (read-only)
on:
  workflow_dispatch: {}
jobs:
  diagnose:
    # Audit F-10: this repo is public, so anything this job prints to the run
    # log is world-readable. The gateway logs it dumps below carry lock IMEIs
    # and rider-device source IPs — that must never reach a public Actions
    # log unmasked. Gating on the same `production` environment used for
    # deploys (required reviewers: baltcircle, YBWKon) restricts who can
    # actually get this diagnostic to run, on top of workflow_dispatch
    # already requiring repo write access to trigger.
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    steps:
      - name: Docker state (IMEI/IP masked)
        run: |
          # 15-digit IMEIs -> keep first 4 / last 2 digits, mask the middle.
          # IPv4 addresses -> mask the last two octets.
          mask() {
            sed -E \
              -e 's/\b([0-9]{4})[0-9]{9}([0-9]{2})\b/\1*********\2/g' \
              -e 's/\b([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}\b/\1.xxx.xxx/g'
          }
          echo "=== docker ps -a (baltcircle) ==="
          docker ps -a --filter "name=baltcircle" | mask
          echo "=== baltcircle-mvp status ==="
          (docker ps --filter "name=baltcircle-mvp" --format "{{.Status}}" || true) | mask
          echo "=== baltcircle-omni inspect ==="
          (docker inspect baltcircle-omni --format 'Created={{.Created}} Image={{.Config.Image}} State={{.State.Status}} Ports={{.NetworkSettings.Ports}}' 2>&1 || true) | mask
          echo "=== baltcircle-omni logs (last 50) ==="
          (docker logs baltcircle-omni --tail 50 2>&1 || true) | mask
          echo "=== port 5100 listeners on host ==="
          ((ss -ltnp 2>/dev/null | grep 5100) || (netstat -ltnp 2>/dev/null | grep 5100) || echo "no ss/netstat output") | mask
          echo "=== baltcircle-mvp lock gateway logs (last 1h, module=omni-tcp) ==="
          (docker logs baltcircle-mvp --since 1h 2>&1 | grep -i 'omni-tcp' | tail -300 || true) | mask
