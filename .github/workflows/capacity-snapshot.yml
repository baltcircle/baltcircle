name: Capacity snapshot (read-only)
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    timeout-minutes: 5
    steps:
      - name: Aggregate resources only (no identities or application logs)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UTC / CPU count / memory bytes ==="
          date -u +%FT%TZ
          nproc
          free -b
          echo "=== Root disk aggregate ==="
          df -B1 --output=size,used,avail,pcent /
          echo "=== Container limits and lifecycle ==="
          docker inspect baltcircle-mvp --format 'MemoryLimit={{.HostConfig.Memory}} NanoCPUs={{.HostConfig.NanoCpus}} OOMKilled={{.State.OOMKilled}} RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}}'
          echo "=== Host CPU / memory / IO sample (first line since boot) ==="
          vmstat 1 10
          echo "=== Container resource samples, 12 over roughly 2 minutes ==="
          for i in $(seq 1 12); do
            date -u +%FT%TZ
            docker stats --no-stream --format 'CPU={{.CPUPerc}} RAM={{.MemUsage}} RAMPercent={{.MemPerc}} PIDs={{.PIDs}}' baltcircle-mvp
            awk '/^MemAvailable:|^SwapFree:/{print}' /proc/meminfo
            sleep 8
          done
          echo "=== Established connections: aggregate count only ==="
          for port in 443 5000 5100; do
            count=$(ss -Htn state established "( sport = :$port )" | wc -l)
            printf 'port=%s count=%s\n' "$port" "$count"
          done
          echo "=== Database aggregate / read-only query ==="
          docker exec -i baltcircle-mvp node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL, statement_timeout: 5000 });
            try {
              await client.connect();
              await client.query('BEGIN READ ONLY');
              const result = await client.query(`SELECT
                (SELECT count(*)::int FROM bikes) AS bikes,
                (SELECT count(*)::int FROM rides WHERE status IN ('active','paused')) AS active_rides,
                (SELECT count(*)::int FROM rides) AS total_rides,
                (SELECT count(*)::int FROM pg_stat_activity WHERE datname=current_database()) AS db_connections,
                (SELECT count(*)::int FROM pg_stat_activity WHERE datname=current_database() AND state='active') AS db_active_connections,
                pg_database_size(current_database()) AS database_bytes,
                current_setting('max_connections') AS max_connections`);
              console.log(JSON.stringify(result.rows[0]));
              await client.query('ROLLBACK');
            } catch (error) {
              console.log(JSON.stringify({ database_snapshot_unavailable: true, error_code: error.code || 'unknown' }));
            } finally { await client.end(); }
          })();
          NODE
      - name: Disk inventory and sanitized application statistics
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Disk and inode capacity ==="
          df -h /
          df -i /
          echo "=== Docker aggregate (no volume removal) ==="
          timeout 30 docker system df
          echo "=== Known storage directories, aggregate bytes only ==="
          for dir in /var/lib/docker /var/log /home/yc-user/osm /home/yc-user/uploads /home/yc-user/actions-runner /opt/actions-runner; do
            if sudo test -d "$dir"; then
              sudo timeout 20 du -sx --block-size=1 "$dir" || true
            fi
          done
          sudo journalctl --disk-usage
          echo "=== Container log limit and size ==="
          docker inspect baltcircle-mvp --format '{{json .HostConfig.LogConfig}}'
          LOG_PATH=$(docker inspect baltcircle-mvp --format '{{.LogPath}}')
          if [ -n "$LOG_PATH" ]; then sudo stat --printf='current_log_bytes=%s\n' "$LOG_PATH"; fi
          echo "=== Last 15m application logs: counts and durations only, capped at 20000 lines ==="
          docker logs --since 15m --tail 20000 baltcircle-mvp 2>&1 | python3 -c '
          import sys, json, collections
          levels=collections.Counter(); statuses=collections.Counter(); durations=[]; unparsed=0; lines=0
          for line in sys.stdin:
              lines+=1
              try:
                  row=json.loads(line)
                  if not isinstance(row,dict): raise ValueError()
                  level=row.get("level")
                  if isinstance(level,int): levels[str(level)]+=1
                  status=row.get("status")
                  if isinstance(status,int) and 100<=status<=599: statuses[str(status)]+=1
                  ms=row.get("durationMs")
                  if isinstance(ms,(int,float)) and ms>=0: durations.append(ms)
              except (ValueError,TypeError): unparsed+=1
          durations.sort()
          def pct(p): return durations[min(len(durations)-1,int((len(durations)-1)*p))] if durations else None
          print(json.dumps({"lines":lines,"unparsed":unparsed,"levels":levels,"http_status":statuses,"timed_requests":len(durations),"p50_ms":pct(.5),"p95_ms":pct(.95),"p99_ms":pct(.99),"max_ms":max(durations) if durations else None}))
          '
      - name: PostgreSQL aggregate counters and session maintenance
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i baltcircle-mvp node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const c = new Client({connectionString:process.env.DATABASE_URL, statement_timeout:5000, connectionTimeoutMillis:5000});
            try {
              await c.connect();
              await c.query('SET default_transaction_read_only = on');
              const show = async (name,sql) => {
                try { console.log(JSON.stringify({[name]:(await c.query(sql)).rows})); }
                catch(e) {console.log(JSON.stringify({[name]:{unavailable:true,code:/^[0-9A-Z]{5}$/.test(e.code||'')?e.code:'unknown'}}));}
              };
              await show('session_aggregate',`SELECT count(*)::int AS total, count(*) FILTER (WHERE expire<now())::int AS expired FROM public.session`);
              await show('largest_tables',`SELECT relname,pg_total_relation_size(relid)::text AS bytes,n_live_tup,n_dead_tup,seq_scan,idx_scan,last_autovacuum,last_autoanalyze FROM pg_stat_user_tables WHERE schemaname='public' ORDER BY pg_total_relation_size(relid) DESC LIMIT 8`);
              await show('connection_states',`SELECT state,wait_event_type,count(*)::int AS count FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() GROUP BY state,wait_event_type`);
              await show('long_transactions',`SELECT count(*)::int AS older_than_30s FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() AND xact_start<now()-interval '30 seconds'`);
              await show('session_indexes',`SELECT indexrelname,idx_scan FROM pg_stat_user_indexes WHERE schemaname='public' AND relname='session'`);
              await show('query_stats_available',`SELECT EXISTS(SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements') AS available`);
              for(let sample=0;sample<2;sample++){
                await show('database_counters_'+sample,`SELECT now() AS sampled_at,xact_commit,xact_rollback,blks_read,blks_hit,temp_bytes,deadlocks,stats_reset FROM pg_stat_database WHERE datname=current_database()`);
                await show('session_writes_'+sample,`SELECT now() AS sampled_at,n_tup_ins,n_tup_upd,n_tup_del,n_dead_tup FROM pg_stat_user_tables WHERE schemaname='public' AND relname='session'`);
                if(sample===0) await new Promise(r=>setTimeout(r,30000));
              }
            } catch(e) {
              console.log(JSON.stringify({db_audit_unavailable:true,code:/^[0-9A-Z]{5}$/.test(e.code||'')?e.code:'unknown'}));
              process.exitCode=1;
            } finally {await c.end();}
          })();
          NODE
