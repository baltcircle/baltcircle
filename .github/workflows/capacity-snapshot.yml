# TEMPORARY DIAGNOSTIC BRANCH ONLY. Do not merge this override into main.
name: Capacity snapshot (read-only)
run-name: BC-002 unlock audit (read-only)
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    name: Read-only BC-002 unlock audit
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    timeout-minutes: 6
    steps:
      - name: Inspect without restart or device commands
        shell: bash
        run: |
          set -uo pipefail
          mask() { sed -E 's/[0-9]{10,}/<id>/g; s/-?[0-9]{1,3}\.[0-9]{4,}/<num>/g'; }
          echo "=== UTC ==="; date -u +%FT%TZ
          echo "=== Container ==="
          docker inspect baltcircle-mvp --format 'Status={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}} OOM={{.State.OOMKilled}} Restarts={{.RestartCount}} StartedAt={{.State.StartedAt}}'
          docker ps --format '{{.Names}} {{.Status}}' | mask
          echo "=== Local HTTP ==="
          curl -sS -o /dev/null -m 10 -w 'local:5000 %{http_code} %{time_total}\n' http://127.0.0.1:5000/version.json || true
          curl -sS -o /dev/null -m 10 -w 'public %{http_code} %{time_total}\n' https://takeride.ru/version.json || true
          echo "=== Established TCP per port ==="
          for port in 443 5000 5100; do printf 'port=%s count=%s\n' "$port" "$(ss -Htn state established "( sport = :$port )" | wc -l)"; done
          ss -Hltn | awk '{print $4}' | grep -E ':(5100|5000|443)$' || echo "no listener match"
          echo "=== Docker log config ==="
          docker inspect baltcircle-mvp --format 'LogDriver={{.HostConfig.LogConfig.Type}} RestartPolicy={{.HostConfig.RestartPolicy.Name}} ExitCode={{.State.ExitCode}} Error={{.State.Error}} FinishedAt={{.State.FinishedAt}} Created={{.Created}}'
          L=/tmp/bc-mvp-logs.txt
          docker logs --since 26h baltcircle-mvp > "$L" 2>&1 || echo "docker logs failed rc=$?"
          echo "log_lines=$(wc -l < "$L")"
          echo "=== Docker die/restart events 26h ==="
          timeout 10 docker events --since 26h --until "$(date -u +%FT%TZ)" --filter container=baltcircle-mvp --filter event=die --filter event=oom --filter event=start --format '{{.Time}} {{.Action}} exit={{index .Actor.Attributes "exitCode"}}' 2>&1 | tail -40 || true
          echo "=== Lines before each process start (crash context, masked) ==="
          grep -nE 'serving on|listening|Server running|lock gateway listening|OMNI.*listen' "$L" | mask | tail -20 || true
          grep -nE 'serving on|listening on|Server running' "$L" | cut -d: -f1 | tail -14 | while read n; do s=$((n>12?n-12:1)); echo "--- before line $n"; sed -n "${s},$((n-1))p" "$L" | grep -viE 'password|token|GET /|POST /|HEAD /' | mask | cut -c1-400; done || true
          echo "=== Fatal/uncaught 26h (masked) ==="
          grep -iE 'fatal|uncaught|unhandled|heap|SIGTERM|SIGKILL|exit(ed)? with|ERR_|throw' "$L" | grep -viE 'password|token' | mask | cut -c1-400 | tail -40 || true
          echo "=== Lock gateway / unlock lines 2h (masked) ==="
          docker logs --since 2h baltcircle-mvp 2>&1 | grep -iE 'startRide|unlock|not connected|gateway|socket|handshake|idle|omni|lock' | grep -viE 'password|token|GET /|HEAD /' | mask | cut -c1-400 | tail -80 || true
          echo "=== Established 5100 sampling (60s) ==="
          for i in $(seq 1 6); do printf '%s 5100=%s\n' "$(date -u +%T)" "$(ss -Htn state established '( sport = :5100 )' | wc -l)"; sleep 10; done
          echo "=== DB state BC-002 ==="
          docker exec -i baltcircle-mvp node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 5000, statement_timeout: 5000 });
            c.on('error', () => {});
            try {
              await c.connect(); await c.query('BEGIN READ ONLY');
              const now = Date.now();
              const age = v => v == null ? null : Math.round((now - (typeof v === 'object' ? v.getTime() : (isNaN(Number(v)) ? Date.parse(v) : Number(v)))) / 1000);
              const b = (await c.query("SELECT * FROM bikes WHERE id='BC-002'")).rows[0];
              const l = b?.lock_imei ? (await c.query('SELECT * FROM locks WHERE imei=$1', [b.lock_imei])).rows[0] : null;
              const pick = (o, keys) => Object.fromEntries(keys.filter(k => o && k in o).map(k => [k, /(_at|seen)$/.test(k) ? age(o[k]) : o[k]]));
              console.log('bike', JSON.stringify({ ...pick(b, ['status','lock_online','battery','battery_level','maintenance_reason','lock_last_seen','lock_last_seen_at','updated_at']), has_lock: !!b?.lock_imei, parking_id_set: b?.parking_id != null }));
              console.log('lock', JSON.stringify(pick(l, ['last_lock_state','last_seen_at','last_location_at','battery_voltage','battery_percent','signal','gsm_signal','firmware','online','created_at','updated_at'])));
              console.log('lock_columns', Object.keys(l || {}).filter(k => !/imei|lat|lng|long|x$|y$/.test(k)).join(','));
              const rides = (await c.query("SELECT id,status,started_at,ended_at,is_test FROM rides WHERE bike_id='BC-002' ORDER BY id DESC LIMIT 6")).rows;
              for (const r of rides) console.log('ride', JSON.stringify({ id: r.id, status: r.status, started_age_s: age(r.started_at), ended_age_s: age(r.ended_at), is_test: r.is_test }));
              const tel = (await c.query("SELECT cmd,count(*)::int n,max(t)::text mx FROM bike_telemetry WHERE bike_id='BC-002' AND t >= $1 GROUP BY cmd ORDER BY cmd", [now - 6*3600e3])).rows;
              for (const r of tel) console.log('telemetry_6h', JSON.stringify({ cmd: r.cmd, n: r.n, newest_age_s: age(r.mx) }));
              await c.query('ROLLBACK');
            } catch (e) { console.log('db_error', /^[A-Za-z0-9_]{1,32}$/.test(String(e.code||'')) ? e.code : 'unknown', String(e.message||'').slice(0,120).replace(/[0-9]{10,}/g,'<id>')); }
            finally { try { await c.end(); } catch {} }
          })();
          NODE
