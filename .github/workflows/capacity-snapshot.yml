# TEMPORARY DIAGNOSTIC BRANCH ONLY. Do not merge this override into main.
name: Capacity snapshot (read-only)
run-name: BC-002 unlock audit v3 (read-only)
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    name: Read-only BC-002 unlock audit
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    timeout-minutes: 6
    steps:
      - name: Inspect without restart or device commands
        shell: bash
        run: |
          set +e
          mask() { sed -E 's/[0-9]{10,}/<id>/g; s/-?[0-9]{1,3}\.[0-9]{4,}/<num>/g; s/"(lat|lng|latitude|longitude|x|y|prevLat|prevLng|newLat|newLng|iccid|mac)":"?[^,}"]*"?/"\1":"<r>"/g'; }
          date -u +%FT%TZ
          echo "=== Established 5100 inside container netns (/proc/net/tcp, state 01, local :13EC) ==="
          for i in $(seq 1 6); do
            n=$(docker exec baltcircle-mvp sh -c 'cat /proc/net/tcp /proc/net/tcp6 2>/dev/null' | awk '$2 ~ /:13EC$/ && $4=="01"' | wc -l)
            printf '%s 5100_in_container=%s\n' "$(date -u +%T)" "$n"; sleep 10
          done
          echo "=== Full container log since start (masked, HTTP access lines dropped) ==="
          docker logs --since 26h baltcircle-mvp 2>&1 | grep -vE '"(GET|HEAD|POST|PUT|PATCH|DELETE) /' | grep -viE 'password|token|otp' | mask | cut -c1-500 | tail -260
