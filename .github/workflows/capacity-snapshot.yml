name: GPS snapshot (read-only, redacted)
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    timeout-minutes: 3
    steps:
      - name: GPS health only (no coordinates or identities)
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i baltcircle-mvp node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL, statement_timeout: 8000 });
            try {
              await c.connect();
              await c.query('BEGIN READ ONLY');
              const target = await c.query("SELECT id FROM bikes WHERE regexp_replace(upper(id), '[^A-Z0-9]', '', 'g') = $1", ['BC002']);
              if (target.rows.length !== 1) throw new Error('target-count');
              const id = target.rows[0].id;
              const print = async (label, sql, args = [id]) => console.log(label, JSON.stringify((await c.query(sql, args)).rows));
              await print('gps_hourly', `SELECT to_char(to_timestamp(t/1000.0) AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24') AS utc_hour,
                count(*) AS reports, count(lat) AS fixes, count(x) AS plotted,
                count(*) FILTER (WHERE satellites=0 AND lat IS NOT NULL) AS zero_satellite_fixes,
                count(*) FILTER (WHERE lat IS NULL) AS no_fix,
                min(hdop) AS min_hdop, max(hdop) AS max_hdop
                FROM bike_telemetry WHERE bike_id=$1 AND cmd IN ('D0','D1')
                  AND t >= (extract(epoch from now())*1000 - 48*3600000)
                GROUP BY 1 ORDER BY 1`);
              await print('ride_windows', `SELECT status, is_test,
                to_timestamp(started_at/1000.0) AS started_utc,
                to_timestamp(ended_at/1000.0) AS ended_utc,
                to_timestamp(physically_locked_at/1000.0) AS closed_utc,
                (SELECT count(*) FROM ride_lock_points p WHERE p.ride_id=r.id) AS projected_points
                FROM rides r WHERE bike_id=$1 ORDER BY started_at DESC LIMIT 10`);
              await print('last_good_fixes', `SELECT to_timestamp(t/1000.0) AS utc,
                satellites, hdop, x IS NOT NULL AS plotted
                FROM bike_telemetry WHERE bike_id=$1 AND lat IS NOT NULL
                ORDER BY t DESC LIMIT 25`);
              await print('state', `SELECT b.status, b.lock_online, l.last_lock_state, l.last_signal_strength,
                l.last_battery_voltage,
                to_timestamp(l.last_seen_at / 1000.0) AS last_report_utc,
                to_timestamp(l.last_location_at / 1000.0) AS last_fix_utc,
                round((extract(epoch from now()) * 1000 - l.last_seen_at) / 1000) AS report_age_seconds,
                round((extract(epoch from now()) * 1000 - l.last_location_at) / 1000) AS fix_age_seconds,
                l.last_latitude IS NOT NULL AND l.last_longitude IS NOT NULL AS has_coordinates,
                (SELECT count(*) FROM rides r WHERE r.bike_id=b.id AND r.status='active') AS active_rides,
                (SELECT bool_or(r.physically_locked_at IS NOT NULL) FROM rides r WHERE r.bike_id=b.id AND r.status='active') AS active_ride_closed,
                (SELECT bool_or(r.is_test) FROM rides r WHERE r.bike_id=b.id AND r.status='active') AS active_ride_is_test
                FROM bikes b LEFT JOIN locks l ON l.imei=b.lock_imei WHERE b.id=$1`);
              await print('gps_recent', `SELECT to_timestamp(t/1000.0) AS utc, cmd, satellites, hdop,
                lat IS NOT NULL AND lng IS NOT NULL AS has_fix,
                x IS NOT NULL AND y IS NOT NULL AS accepted
                FROM bike_telemetry WHERE bike_id=$1 AND cmd IN ('D0','D1')
                ORDER BY t DESC LIMIT 20`);
              await print('gps_by_day', `SELECT date_trunc('day', to_timestamp(t/1000.0)) AS utc_day,
                count(*) AS reports, count(lat) AS fixes,
                count(*) FILTER (WHERE lat IS NOT NULL AND (hdop IS NULL OR hdop<=10)) AS usable_accuracy,
                count(*) FILTER (WHERE hdop>10) AS rejected_accuracy,
                min(hdop) AS min_hdop, max(hdop) AS max_hdop,
                min(satellites) AS min_satellites, max(satellites) AS max_satellites
                FROM bike_telemetry WHERE bike_id=$1 AND cmd IN ('D0','D1')
                  AND t >= (extract(epoch from now())*1000 - 7*86400000)
                GROUP BY 1 ORDER BY 1 DESC`);
              await print('telemetry_last_hour', `SELECT cmd, count(*) AS reports,
                to_timestamp(max(t)/1000.0) AS latest_utc,
                max(satellites) AS max_satellites
                FROM bike_telemetry WHERE bike_id=$1 AND t >= (extract(epoch from now())*1000-3600000)
                GROUP BY cmd ORDER BY cmd`);
              await c.query('ROLLBACK');
            } catch (e) {
              console.log(JSON.stringify({ diagnostic_failed: true, code: /^[0-9A-Z]{5}$/.test(e.code || '') ? e.code : 'unknown' }));
              process.exitCode = 1;
            } finally { await c.end(); }
          })();
          NODE
      - name: Sanitized gateway log counters
        shell: bash
        run: |
          set -euo pipefail
          docker logs baltcircle-mvp --since 4h 2>&1 | docker exec -i baltcircle-mvp node -e '
          const {Client}=require("pg");
          const readline=require("readline");
          (async()=>{
            const c=new Client({connectionString:process.env.DATABASE_URL,statement_timeout:5000});
            await c.connect();
            await c.query("BEGIN READ ONLY");
            const q=await c.query("SELECT lock_imei FROM bikes WHERE id=$1",["BC-002"]);
            const imei=q.rows[0]?.lock_imei;
            await c.query("ROLLBACK"); await c.end();
            if(!imei)throw Error("missing");
            const labels={
              "failed to persist lock report":"persist_error",
              "telemetry batch write failed":"batch_error",
              "omni: rejected low-accuracy GPS fix (hdop exceeds MAX_ACCEPTABLE_HDOP)":"accuracy_rejection",
              "omni: rejected implausible GPS fix (jump exceeds MAX_PLAUSIBLE_GPS_JUMP_M)":"jump_rejection",
              "gps-sync: tracking interval updated":"tracking_sync",
              "rejecting invalid payload":"invalid_payload",
              "lock connected":"connected",
              "replacing stale socket":"reconnect",
              "sent experimental D1 tracking-stop probe":"diagnostic_stop",
              "sent experimental D1 tracking-interval probe":"diagnostic_interval"
            };
            const counts={},sync=[],positions=[];
            let nofix=0,valid=0;
            for await(const line of readline.createInterface({input:process.stdin})){
              let o;try{o=JSON.parse(line)}catch{continue}
              if(o.imei===imei && o.msg==="omni-diag frame" && o.detail?.type==="position"){
                if(o.detail.valid)valid++;else nofix++;
                positions.push({
                  at:typeof o.time==="number"?o.time:null,
                  valid:o.detail.valid===true,
                  tracking:o.detail.tracking===true,
                  satellites:typeof o.detail.fix?.satellites==="number"?o.detail.fix.satellites:null
                });
              }
              const label=labels[o.msg];
              if(!label || (o.imei!==imei && label!=="batch_error"))continue;
              counts[label]=(counts[label]||0)+1;
              if(label==="tracking_sync")sync.push({
                at:typeof o.time==="number"?o.time:null,
                interval_seconds:typeof o.intervalSeconds==="number"?o.intervalSeconds:null,
                sent:o.sent===true
              });
            }
            const keys=["OMNI_MAX_FRAMES_PER_SECOND","OMNI_FRAME_BUCKET_CAPACITY","OMNI_STATUS_MIN_INTERVAL_MS","OMNI_FLUSH_INTERVAL_MS","OMNI_MAX_BATCH_ROWS","OMNI_DIAG_SEND_D1_SECONDS"];
            const numericConfig={};
            for(const k of keys)numericConfig[k]=/^[0-9]+$/.test(process.env[k]||"")?Number(process.env[k]):null;
            console.log(JSON.stringify({counts,numericConfig,diagnostic_target_matches:process.env.OMNI_DIAG_IMEI===imei,
              raw_position_counts:{valid,nofix},last_raw_positions:positions.slice(-12),last_tracking_sync:sync}));
          })().catch(()=>{console.log("{\"log_diagnostic_failed\":true}");process.exitCode=1});
          '
