# TEMPORARY DIAGNOSTIC BRANCH ONLY. Do not merge this override into main.
name: Capacity snapshot (read-only)
run-name: Inbound reachability audit (read-only)
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  snapshot:
    name: Read-only inbound reachability audit
    environment: production
    runs-on: [self-hosted, baltcircle-prod]
    timeout-minutes: 4
    steps:
      - name: Inspect network without changes
        shell: bash
        run: |
          set +e
          date -u +%FT%TZ
          echo "=== Egress public IP ==="
          for u in https://api.ipify.org https://ifconfig.me/ip https://ipv4.icanhazip.com; do printf '%s ' "$u"; curl -4 -sS -m 8 "$u"; echo; done
          echo "=== DNS ==="; getent hosts takeride.ru www.takeride.ru
          echo "=== Local IPv4 ==="; ip -4 -o addr show | awk '{print $2, $4}'
          echo "=== Listeners ==="; ss -Hltn | awk '{print $4}' | sort -u
          echo "=== Firewall (read-only) ==="
          (command -v ufw >/dev/null && sudo -n ufw status verbose) 2>&1 | head -30
          sudo -n nft list ruleset 2>&1 | grep -E 'table|chain|policy|drop|reject|dport' | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}(\/[0-9]+)?/<ip>/g' | head -50
          sudo -n iptables -S INPUT 2>&1 | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}(\/[0-9]+)?/<ip>/g' | head -30
          sudo -n fail2ban-client status 2>&1 | head -5
          echo "=== Inbound :443 established / syn-recv ==="
          ss -Htn state established '( sport = :443 )' | wc -l
          ss -Htn state syn-recv '( sport = :443 )' | wc -l
          echo "=== App log lines per hour (24h, counts only) ==="
          docker logs --since 24h baltcircle-mvp 2>&1 | grep -oE '"time":[0-9]{13}' | cut -d: -f2 | awk '{print strftime("%m-%d %H", int($1/1000), 1)}' | sort | uniq -c | tail -26
          echo "=== Containers ==="; docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'
          systemctl is-active nginx caddy 2>/dev/null
          echo "=== Hairpin via DNS ==="
          curl -sS -o /dev/null -m 8 -w 'via-dns %{http_code} %{remote_ip}\n' https://takeride.ru/version.json
