name: Generate Address Tiles
# Builds addresses.pmtiles (OSM house numbers) into /home/yc-user/osm, served by
# the app at /addresses.pmtiles. Kept separate from pmtiles-gen.yml so the heavy
# 571 MB region extract and the ~1 MB address overlay regenerate independently.
on:
  workflow_dispatch:
    inputs:
      addr_bbox:
        description: "Address bbox S,W,N,E (Overpass order — city + coastal towns)"
        required: false
        default: "54.60,19.85,55.00,20.70"
      city:
        description: "City label for logs"
        required: false
        default: "Kaliningrad"

# Audit M4: checkout only, then a local shell script (scripts/build-addresses.sh)
# that writes to a host bind mount — no GitHub API calls, no release created
# (unlike pmtiles-gen.yml, which does and needs contents:write for that reason).
permissions:
  contents: read

jobs:
  addresses:
    runs-on: [self-hosted, baltcircle-prod]
    # audit HIGH #5 fix: writes to the prod host bind mount unattended, no
    # approval gate; added the same "production" environment used elsewhere.
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Build address pmtiles from OSM and place in /home/yc-user/osm
        env:
          ADDR_BBOX: ${{ github.event.inputs.addr_bbox || '54.60,19.85,55.00,20.70' }}
          CITY: ${{ github.event.inputs.city || 'Kaliningrad' }}
        shell: bash
        run: bash scripts/build-addresses.sh
