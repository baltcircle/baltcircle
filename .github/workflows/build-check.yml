name: Build Check
on: [workflow_dispatch, pull_request]

# Audit M4: checkout + npm ci + tsc + test only, no GitHub API calls.
permissions:
  contents: read

jobs:
  # Type-check and unit tests. Runs on every PR so type errors and business-logic
  # regressions (billing, ride start/finish, payment webhook) fail CI instead of
  # slipping through silently (audit H5). No secrets or DB required — tests mock
  # the storage layer.
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  build:
    # GitHub-hosted, NOT the self-hosted production runner (audit CRITICAL:
    # this job runs on every pull_request, including from forks, before any
    # review. `docker build` executes arbitrary RUN instructions from the
    # PR's own Dockerfile/context; running that against the prod VM's Docker
    # daemon handed untrusted PR code a path onto the production host. A
    # GitHub-hosted runner is a fresh, isolated, torn-down-after-the-job VM
    # with Docker preinstalled — same validation (does the image still
    # build?), zero access to production. The prod self-hosted runner is now
    # only used by deploy.yml, which triggers on trusted `push` to `main`
    # after review, never on unreviewed PR branches.
    runs-on: ubuntu-latest
    # No `contents: write` — the build log is published as an Actions artifact
    # instead of being self-committed back into the repo (audit M1).
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture error
        run: |
          set +e
          docker build --no-cache -t bc-test . > /tmp/build.log 2>&1
          EXIT=$?
          echo "Exit: $EXIT"
          # Keep the last 50 lines of the build log for the artifact.
          tail -50 /tmp/build.log > diag-result.txt
          cat diag-result.txt
          exit $EXIT
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: diag-result.txt
          retention-days: 14
