name: Debug production card-bind logs

on:
  workflow_dispatch:

# Audit M4: no checkout, no GitHub API calls — pure `docker logs` on the
# self-hosted runner. Deny all GITHUB_TOKEN scopes.
permissions: {}

jobs:
  logs:
    name: Extract recent card-bind decisions
    runs-on:
      - self-hosted
      - baltcircle-prod
    # audit HIGH #5 fix: runs unattended on the prod self-hosted runner with
    # no approval gate; added the same "production" environment used by
    # deploy.yml / diagnose-ride-track.yml / fetch-logs.yml.
    environment: production
    steps:
      - name: Print recent card-bind diagnostics
        run: |
          set -o pipefail
          docker logs baltcircle-mvp --since 6h 2>&1 \
            | grep -E '\[tbank\] card-bind (reconciliation|state response|state check failed|reconciliation row failed|guard decision)|\[tbank\] binding state query rejected|POST /api/payments/tbank/(bind-card|bind-card-payment|add-card)' \
            | tail -500 || true
