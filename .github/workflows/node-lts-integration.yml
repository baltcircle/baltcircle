name: Node LTS PostgreSQL integration

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: node-lts-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-node24:
    name: Node 24 PostgreSQL integration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: takeride_admin_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install with strict engine compatibility
        run: npm ci --engine-strict
      - name: Administrative and rider data integration checks
        env:
          ADMIN_DATA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/takeride_admin_test
        run: npx tsx script/check-admin-data.ts
      - name: Lock-only route and distance regressions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/takeride_admin_test
        run: npx tsx script/test-lock-tracks.ts
      - name: Bike maintenance_reason invariant regressions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/takeride_admin_test
        run: npx tsx script/test-maintenance-reason.ts
      - name: Session write, CSRF and expiry regressions
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/takeride_admin_test
        run: npx tsx script/test-session-store.ts
