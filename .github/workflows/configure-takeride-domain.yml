name: Configure TakeRide Domain

# Applies the hardened reference nginx config (deploy/nginx/baltcircle.conf —
# TLS 1.2/1.3, HSTS, CSP, security headers, OTP/payment rate limits) as the
# real production config for takeride.ru, and (re)issues the Let's Encrypt
# certificate via the webroot method so certbot never mutates this file
# in place (unlike the old `certbot --nginx` flow).
#
# Safe to re-run: cert issuance is idempotent (certbot skips renewal unless
# the cert is close to expiry), and the hardened config is applied atomically
# with an `nginx -t` gate + automatic rollback to the previous config on
# failure — a bad config or DNS/cert mismatch never leaves nginx down.
#
# audit HIGH #20: previously this workflow wrote a different, unhardened
# config (no TLS security headers, no rate limiting) and the repo's
# deploy/nginx/baltcircle.conf reference was never applied anywhere.

on:
  workflow_dispatch:

jobs:
  configure-domain:
    name: Apply hardened nginx config and HTTPS for takeride.ru
    runs-on:
      - self-hosted
      - baltcircle-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap HTTP-only config for ACME challenge
        run: |
          set -euo pipefail
          sudo mkdir -p /var/www/certbot
          sudo tee /etc/nginx/sites-available/baltcircle > /dev/null <<'EOF'
          server {
              listen 80;
              server_name takeride.ru www.takeride.ru;

              location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
              }

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
          sudo ln -sf /etc/nginx/sites-available/baltcircle /etc/nginx/sites-enabled/baltcircle
          sudo nginx -t
          sudo systemctl reload nginx

      - name: Issue/renew certificate via webroot (idempotent)
        run: |
          set -euo pipefail
          sudo certbot certonly --webroot -w /var/www/certbot \
            -d takeride.ru \
            -d www.takeride.ru \
            --non-interactive \
            --agree-tos \
            -m admin@takeride.ru \
            --keep-until-expiring

      - name: Apply hardened production config
        run: |
          set -euo pipefail
          BACKUP="/etc/nginx/sites-available/baltcircle.backup.$(date +%Y%m%d%H%M%S)"
          sudo cp /etc/nginx/sites-available/baltcircle "$BACKUP"
          echo "Backed up previous config to $BACKUP"

          sudo cp deploy/nginx/baltcircle.conf /etc/nginx/sites-available/baltcircle

          if sudo nginx -t; then
            sudo systemctl reload nginx
            echo "✅ Hardened config applied and nginx reloaded."
          else
            echo "❌ nginx -t failed on the new config — rolling back." >&2
            sudo cp "$BACKUP" /etc/nginx/sites-available/baltcircle
            sudo nginx -t
            sudo systemctl reload nginx
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail --max-time 30 https://takeride.ru >/dev/null
          curl --fail --max-time 30 https://www.takeride.ru >/dev/null
          echo "✅ https://takeride.ru and https://www.takeride.ru respond."
