name: Deploy BaltCircle

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Audit M4: neither job here calls the GitHub API (both only run
# actions/checkout + local build/deploy steps) — contents:read is the
# minimum GITHUB_TOKEN scope actions/checkout needs and nothing more.
permissions:
  contents: read

concurrency:
  group: baltcircle-production
  cancel-in-progress: true

jobs:
  # Audit HIGH #19: this job used to run ONLY on pull_request (build-check.yml),
  # so a direct push to `main` (or a merge of a branch whose head commit was
  # never itself checked) could reach the self-hosted prod runner with zero
  # verification. Gating `deploy` on this job closes that gap: every push to
  # main now re-runs type-check, unit tests and a dependency-vulnerability
  # audit on a disposable GitHub-hosted runner before the prod Docker daemon
  # is ever touched. Full SAST/secret-scan/image-scan/SBOM is tracked
  # separately (audit HIGH #22) — this gate is intentionally the fast/cheap
  # subset that must never regress on the exact commit being deployed.
  test:
    name: Type-check, unit tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy on Yandex Cloud VM
    needs: test
    runs-on:
      - self-hosted
      - baltcircle-prod
    # Ties this job to a GitHub Environment named "production" (audit
    # CRITICAL, same finding as build-check.yml's runner move). The YAML
    # alone does not enforce anything — required-reviewer/branch-restriction
    # rules must be configured once in GitHub: Settings → Environments →
    # production → add required reviewers and restrict to the `main` branch.
    # Once configured, every run of this job (the only workflow left that
    # touches the self-hosted prod runner) pauses for an explicit human
    # approval before it can reach the production Docker daemon.
    environment: production

    steps:
      # The one-shot migration step below mounts the runner workspace into a
      # root container to run `npm ci`, which leaves root-owned files behind.
      # actions/checkout's `git clean -ffdx` then cannot delete them and the
      # checkout fails on every subsequent run. This pre-checkout step uses a
      # short-lived root container to reset ownership of the workspace back to
      # the runner user so checkout can clean it. No-op when the dir is absent
      # or already owned correctly.
      - name: Reclaim workspace ownership (pre-checkout)
        run: |
          set -e
          WORKDIR="${{ github.workspace }}"
          if [ -d "$WORKDIR" ]; then
            HOST_UID=$(id -u)
            HOST_GID=$(id -g)
            docker run --rm \
              -v "$WORKDIR":/ws \
              alpine:3.20 \
              chown -R "$HOST_UID:$HOST_GID" /ws || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      # Audit HIGH #23 (zero-budget variant): the single prod VM is the one
      # accepted point of failure for now (horizontal scaling deferred to
      # 1-2 months before launch — see docs/runbook-incident-response.md).
      # `restart: unless-stopped` in docker-compose.yml only takes effect
      # once dockerd itself is running, so make sure both services actually
      # come back on their own after a VM reboot instead of needing someone
      # to notice and SSH in. Idempotent — safe to run on every deploy.
      - name: Ensure docker/nginx survive a VM reboot
        run: |
          sudo systemctl enable docker
          sudo systemctl enable nginx

      # One-shot data migration: legacy SQLite (data.db in the old Docker volume)
      # -> managed PostgreSQL. Runs only if the legacy volume still holds a
      # data.db AND the migration has not been marked done. The migrate script is
      # idempotent (ON CONFLICT DO NOTHING), and a marker file in the volume stops
      # it from re-running on every deploy. Uses host networking so the container
      # reaches the managed PG the same way the VM does.
      - name: Migrate legacy SQLite data to PostgreSQL (one-shot)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          LEGACY_VOLUME="baltcicl_baltcircle_data"

          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Secret DATABASE_URL is not set — cannot migrate or deploy. Set it in repo Settings → Secrets → Actions."
            exit 1
          fi

          if ! docker volume inspect "$LEGACY_VOLUME" >/dev/null 2>&1; then
            echo "ℹ️ Legacy volume $LEGACY_VOLUME not found — nothing to migrate (fresh install). Skipping."
            exit 0
          fi

          # Check the marker + presence of data.db inside the legacy volume.
          STATE=$(docker run --rm -v "$LEGACY_VOLUME":/legacy:ro alpine:3.20 sh -c '
            if [ -f /legacy/.migrated-to-pg ]; then echo DONE;
            elif [ -f /legacy/data.db ]; then echo PENDING;
            else echo NODB; fi')

          if [ "$STATE" = "DONE" ]; then
            echo "✅ Migration already completed earlier (marker present). Skipping."
            exit 0
          fi
          if [ "$STATE" = "NODB" ]; then
            echo "ℹ️ No data.db in legacy volume — nothing to migrate. Skipping."
            exit 0
          fi

          echo "➡️ Stopping old app container so it releases the SQLite file (WAL flush)..."
          docker compose stop baltcircle || true

          echo "➡️ Running one-shot SQLite → PostgreSQL migration..."
          # Legacy volume mounted read-write on purpose: the migrate script runs
          # wal_checkpoint(TRUNCATE) to fold data.db-wal into data.db before
          # reading, so the freshest transactions are not lost.
          # Run npm ci in a container-internal copy of the repo (/build) instead
          # of directly in the mounted workspace, so root-owned node_modules are
          # never written into $GITHUB_WORKSPACE (which would break the next
          # checkout's git clean). The workspace is mounted read-only as /src.
          docker run --rm \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SKIP_DEMO_SEED=1 \
            -e SQLITE_PATH=/legacy/data.db \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v "$LEGACY_VOLUME":/legacy \
            -w /build \
            -e NODE_EXTRA_CA_CERTS=/tmp/yc-root.crt \
            node:20-bookworm-slim \
            bash -c '
              set -e
              apt-get update >/dev/null && apt-get install -y --no-install-recommends python3 make g++ curl ca-certificates rsync >/dev/null
              curl -fsSL -o /tmp/yc-root.crt https://storage.yandexcloud.net/cloud-certs/CA.pem
              mkdir -p /build
              rsync -a --exclude node_modules /src/ /build/
              npm ci
              echo "— creating schema (no demo seed)"
              npx tsx -e "import(\"./server/db/bootstrap\").then(m=>m.bootstrapReady).then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1);})"
              echo "— dry run"
              npx tsx script/migrate-sqlite-to-pg.ts --dry-run
              echo "— real migration"
              npx tsx script/migrate-sqlite-to-pg.ts
            '

          # Mark the volume so future deploys skip migration.
          docker run --rm -v "$LEGACY_VOLUME":/legacy alpine:3.20 sh -c 'date -u +%FT%TZ > /legacy/.migrated-to-pg'
          echo "✅ Migration finished and marked complete."

      - name: Rebuild and restart Docker app
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          VITE_YANDEX_MAPS_API_KEY: ${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMSRU_API_ID: ${{ secrets.SMSRU_API_ID }}
          SIGMASMS_TOKEN: ${{ secrets.SIGMASMS_TOKEN }}
          SIGMASMS: ${{ secrets.SIGMASMS }}
          SIGMASMS_SENDER: ${{ secrets.SIGMASMS_SENDER }}
          # Audit M1: previously only documented in .env.example, never wired into
          # the deploy — no way to tune these in production without editing code.
          SIGMASMS_MESSAGE_TEMPLATE: ${{ vars.SIGMASMS_MESSAGE_TEMPLATE }}
          PG_POOL_MAX: ${{ vars.PG_POOL_MAX }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TELEMETRY_INGEST_TOKEN: ${{ secrets.TELEMETRY_INGEST_TOKEN }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYMENT_TOKEN_KEY: ${{ secrets.PAYMENT_TOKEN_KEY }}
          ADMIN_PHONE_NUMBERS: ${{ secrets.ADMIN_PHONE_NUMBERS }}
          TBANK_TERMINAL_KEY: ${{ secrets.TBANK_TERMINAL_KEY }}
          TBANK_PASSWORD: ${{ secrets.TBANK_PASSWORD }}
          TBANK_API_BASE: ${{ secrets.TBANK_API_BASE }}
          TBANK_ADD_CARD_CHECK_TYPE: ${{ vars.TBANK_ADD_CARD_CHECK_TYPE }}
          TBANK_CARD_BIND_AMOUNT_KOPEKS: ${{ vars.TBANK_CARD_BIND_AMOUNT_KOPEKS }}
          TBANK_CARD_BIND_METHOD: ${{ vars.TBANK_CARD_BIND_METHOD }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          OMNI_MAX_CONNECTIONS: ${{ vars.OMNI_MAX_CONNECTIONS }}
          OMNI_IDLE_TIMEOUT_MS: ${{ vars.OMNI_IDLE_TIMEOUT_MS }}
          OMNI_MAX_NEW_CONNECTIONS_PER_IP: ${{ vars.OMNI_MAX_NEW_CONNECTIONS_PER_IP }}
          OMNI_NEW_CONNECTION_WINDOW_MS: ${{ vars.OMNI_NEW_CONNECTION_WINDOW_MS }}
          OMNI_MAX_FRAMES_PER_SECOND: ${{ vars.OMNI_MAX_FRAMES_PER_SECOND }}
          OMNI_FRAME_BUCKET_CAPACITY: ${{ vars.OMNI_FRAME_BUCKET_CAPACITY }}
          OMNI_STATUS_MIN_INTERVAL_MS: ${{ vars.OMNI_STATUS_MIN_INTERVAL_MS }}
          OMNI_FLUSH_INTERVAL_MS: ${{ vars.OMNI_FLUSH_INTERVAL_MS }}
          OMNI_MAX_BATCH_ROWS: ${{ vars.OMNI_MAX_BATCH_ROWS }}
          OMNI_DIAG_IMEI: ${{ vars.OMNI_DIAG_IMEI }}
          OMNI_DIAG_SEND_D1_SECONDS: ${{ vars.OMNI_DIAG_SEND_D1_SECONDS }}
          UPLOADS_DIR: ${{ vars.UPLOADS_DIR }}
          RUSENDER_API_KEY: ${{ secrets.RUSENDER_API_KEY }}
          RUSENDER_KEY_ID: ${{ secrets.RUSENDER_KEY_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          VK_APP_ID: ${{ secrets.VK_APP_ID }}
          VK_SECURE_KEY: ${{ secrets.VK_SECURE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
        run: |
          set -e
          # Audit HIGH #19: tag the currently-running image before replacing it,
          # so a bad deploy can be rolled back automatically if the smoke test
          # below fails. Uses whatever image name/tag `compose build` actually
          # produces (derived from the `name:` key in docker-compose.yml) instead
          # of a hardcoded string, so this keeps working if the project/service
          # name ever changes.
          IMAGE=$(docker compose config --images | head -1)
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker tag "$IMAGE" "${IMAGE}-rollback"
            echo "✅ Backed up current image as ${IMAGE}-rollback"
            echo "HAS_ROLLBACK=1" >> "$GITHUB_ENV"
          else
            echo "ℹ️ No previous image found (first deploy) — nothing to roll back to."
            echo "HAS_ROLLBACK=0" >> "$GITHUB_ENV"
          fi

          docker compose up -d --build --force-recreate --remove-orphans
          # Keep the just-tagged rollback image out of prune's reach (it has no
          # dangling <none> tag once retagged, but be explicit with -f anyway
          # since prune only removes UNUSED images and the rollback tag keeps
          # the old layer referenced until the next successful deploy retags it).
          docker image prune -f
          docker ps --filter "name=baltcircle"

      - name: Smoke test local app
        run: |
          set -e
          wait_for() {
            local url="$1"
            local label="$2"
            local deadline=$(( $(date +%s) + 120 ))
            until curl --fail --silent --max-time 10 "$url" >/dev/null; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Smoke test failed: $label ($url) not healthy within 120s"
                exit 1
              fi
              echo "Waiting for $label ($url)..."
              sleep 5
            done
            echo "OK: $label ($url)"
          }
          wait_for http://127.0.0.1:5000 "app root"
          wait_for http://127.0.0.1:5000/api/bikes "bikes API"
          wait_for http://127.0.0.1:5000/api/parkings "parkings API"

      # Audit HIGH #19: automatic rollback. Same backup→apply→verify→rollback
      # pattern already proven tonight in configure-takeride-domain.yml. Only
      # runs if an earlier step failed AND a rollback image actually exists
      # (first-ever deploy has nothing to roll back to). Still exits 1 so the
      # run is correctly reported as failed in CI even when recovery succeeds.
      - name: Rollback to previous image on failure
        if: failure() && env.HAS_ROLLBACK == '1'
        run: |
          set +e
          echo "🔙 Deploy or smoke test failed — rolling back to previous image..."
          docker tag "${DEPLOY_IMAGE}-rollback" "$DEPLOY_IMAGE"
          docker compose up -d --no-build --force-recreate --remove-orphans

          deadline=$(( $(date +%s) + 120 ))
          until curl --fail --silent --max-time 10 http://127.0.0.1:5000 >/dev/null; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "❌ CRITICAL: rollback image ALSO failed the health check — manual intervention required now."
              docker ps -a --filter "name=baltcircle"
              exit 1
            fi
            echo "Waiting for rolled-back app to become healthy..."
            sleep 5
          done
          echo "✅ Rollback successful — previous version is healthy and serving traffic again."
          exit 1

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Деплой завершён успешно: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Коммит: ${{ github.sha }}"
          echo "Автор: ${{ github.actor }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Деплой завершился с ошибкой: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Коммит: ${{ github.sha }}"
          if [ "${HAS_ROLLBACK:-0}" = "1" ]; then
            echo "ℹ️ Автооткат на предыдущий образ был выполнен шагом выше — см. его результат."
          else
            echo "⚠️ Откатывать было нечего — это первый деплой либо сбой произошёл до этапа сборки образа."
          fi
          echo "===== docker ps ====="
          docker ps -a --filter "name=baltcircle" || true
          echo "===== app container logs (last 200) ====="
          docker logs --tail 200 baltcircle-mvp 2>&1 || true
